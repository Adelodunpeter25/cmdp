name: Build macOS DMG

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: x64
          - os: macos-14
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'daemon/go.mod'
          cache-dependency-path: 'daemon/go.sum'

      - name: Log Environment Information
        run: |
          echo "Xcode Version:"
          xcodebuild -version
          echo "Swift Version:"
          swift --version
          echo "Go Version:"
          go version

      - name: Make package script executable
        run: chmod +x scripts/package.sh

      - name: Run Build and Package
        run: ./scripts/package.sh ${{ matrix.arch }}

      - name: Rename Artifact by Architecture
        run: |
          mv cmdp/cmdp.dmg cmdp-${{ matrix.arch }}.dmg
          echo "Renamed cmdp/cmdp.dmg to cmdp-${{ matrix.arch }}.dmg"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmdp-${{ matrix.arch }}
          path: cmdp-${{ matrix.arch }}.dmg
          if-no-files-found: error

  release:
    name: Create Tag and Release
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download x64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: cmdp-x64
          path: .

      - name: Download arm64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: cmdp-arm64
          path: .

      - name: Recreate Tag and Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Delete release and tag on remote if they exist
          echo "Deleting remote release and tag 'v1'..."
          gh release delete v1 --yes --cleanup-tag || true

          # 2. Delete tag locally and on remote if it exists
          echo "Deleting tag 'v1'..."
          git tag -d v1 || true
          git push origin :refs/tags/v1 || true

          # Give GitHub API a moment to process the deletion
          sleep 5

          # 3. Create new release with build assets
          # We use --target to specify the commit, and 'gh' will handle tag creation.
          echo "Creating new release 'v1'..."
          gh release create v1 cmdp-x64.dmg cmdp-arm64.dmg \
            --target ${{ github.sha }} \
            --title "Release v1" \
            --notes "Automated build of v1 from commit ${{ github.sha }} on $(date -u +'%Y-%m-%d %H:%M:%S') UTC"

