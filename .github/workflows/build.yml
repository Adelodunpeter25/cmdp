name: Build macOS DMG

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: x64
          - os: macos-14
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'daemon/go.mod'
          cache-dependency-path: 'daemon/go.sum'

      - name: Log Environment Information
        run: |
          echo "Xcode Version:"
          xcodebuild -version
          echo "Swift Version:"
          swift --version
          echo "Go Version:"
          go version

      - name: Compute App Version
        run: |
          latest_tag=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [[ -z "$latest_tag" ]]; then
            base_major=1
            base_minor=0
            base_patch=0
          else
            version="${latest_tag#v}"
            IFS='.' read -r base_major base_minor base_patch <<< "$version"
          fi

          if [[ "$base_patch" -ge 9 ]]; then
            base_minor=$((base_minor + 1))
            base_patch=0
          else
            base_patch=$((base_patch + 1))
          fi

          next_version="${base_major}.${base_minor}.${base_patch}"
          echo "CMDP_VERSION=$next_version" >> "$GITHUB_ENV"
          echo "CMDP_BUILD_NUMBER=$((base_major * 10000 + base_minor * 100 + base_patch))" >> "$GITHUB_ENV"
          echo "Next version: $next_version"

      - name: Make package script executable
        run: chmod +x scripts/package.sh

      - name: Run Build and Package
        run: ./scripts/package.sh ${{ matrix.arch }}

      - name: Rename Artifact by Architecture
        run: |
          mv cmdp/cmdp.dmg cmdp-${{ matrix.arch }}.dmg
          echo "Renamed cmdp/cmdp.dmg to cmdp-${{ matrix.arch }}.dmg"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmdp-${{ matrix.arch }}
          path: cmdp-${{ matrix.arch }}.dmg
          if-no-files-found: error

  release:
    name: Create Tag and Release
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download x64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: cmdp-x64
          path: .

      - name: Download arm64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: cmdp-arm64
          path: .

      - name: Resolve Swift Package Dependencies
        run: |
          cd cmdp
          swift package resolve

      - name: Compute Release Version
        run: |
          latest_tag=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [[ -z "$latest_tag" ]]; then
            base_major=1
            base_minor=0
            base_patch=0
          else
            version="${latest_tag#v}"
            IFS='.' read -r base_major base_minor base_patch <<< "$version"
          fi

          if [[ "$base_patch" -ge 9 ]]; then
            base_minor=$((base_minor + 1))
            base_patch=0
          else
            base_patch=$((base_patch + 1))
          fi

          next_version="${base_major}.${base_minor}.${base_patch}"
          echo "CMDP_VERSION=$next_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$next_version" >> "$GITHUB_ENV"
          echo "Next release tag: v$next_version"

      - name: Recreate Tag and Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Delete release and tag on remote if they exist
          echo "Deleting remote release and tag '${RELEASE_TAG}'..."
          gh release delete "${RELEASE_TAG}" --yes --cleanup-tag || true

          # 2. Delete tag locally and on remote if it exists
          echo "Deleting tag '${RELEASE_TAG}'..."
          git tag -d "${RELEASE_TAG}" || true
          git push origin ":refs/tags/${RELEASE_TAG}" || true

          # Give GitHub API a moment to process the deletion
          sleep 5

      - name: Create new release 'v1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          gh release create "${RELEASE_TAG}" cmdp-x64.dmg cmdp-arm64.dmg \
            --target ${{ github.sha }} \
            --title "Release ${RELEASE_TAG}" \
            --notes "Automated build of ${RELEASE_TAG} from commit ${{ github.sha }} on $(date -u +'%Y-%m-%d %H:%M:%S') UTC"

          # Generate and sign Sparkle appcast if private key is available
          if [[ -n "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "Generating Sparkle appcast..."

            # Find Sparkle's generate_appcast tool
            # (In CI, we need to locate it within the build artifacts)
            GENERATE_APPCAST=$(find cmdp/.build -name "generate_appcast" -type f | head -n 1)

            if [[ -n "$GENERATE_APPCAST" ]]; then
              mkdir -p sparkle_assets/x64 sparkle_assets/arm64
              cp cmdp-x64.dmg sparkle_assets/x64/
              cp cmdp-arm64.dmg sparkle_assets/arm64/

              if "$GENERATE_APPCAST" sparkle_assets/x64/; then
                mv sparkle_assets/x64/appcast.xml appcast-x64.xml
              else
                echo "⚠️  Failed to generate x64 appcast."
              fi

              if "$GENERATE_APPCAST" sparkle_assets/arm64/; then
                mv sparkle_assets/arm64/appcast.xml appcast-arm64.xml
              else
                echo "⚠️  Failed to generate arm64 appcast."
              fi

              if [[ -f appcast-x64.xml && -f appcast-arm64.xml ]]; then
                gh release upload "${RELEASE_TAG}" appcast-x64.xml appcast-arm64.xml --clobber
                echo "Sparkle appcasts updated."
              fi
            else
               echo "⚠️  generate_appcast tool not found!"
            fi
          else
            echo "⏭️  Skipping appcast generation (SPARKLE_PRIVATE_KEY missing)."
          fi
